server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (react-router) fall back to the app shell
  location / {
    try_files $uri /index.html;
  }
}
