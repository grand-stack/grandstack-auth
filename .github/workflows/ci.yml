name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gateway:
    uses: grand-stack/.github/.github/workflows/ci-node.yml@v1
    with:
      scripts: "typecheck test"
      working-directory: gateway
      check-headers: false
  client:
    uses: grand-stack/.github/.github/workflows/ci-node.yml@v1
    with:
      scripts: "typecheck test build"
      working-directory: client
      check-headers: false
  repository:
    uses: grand-stack/.github/.github/workflows/ci-node.yml@v1
    with:
      install: false
      scripts: ""
      commands: node scripts/check-links.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grandstack-auth-gateway:ci gateway
      - run: docker build -t grandstack-auth-client:ci client
