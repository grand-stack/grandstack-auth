<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">Login, then a protected write: allowed for an editor, refused at the gateway for a user, and silently filtered for a review you do not own</title><desc id="d">The client logs in at Keycloak with authorization code and PKCE and receives an access token. Bob, an editor, creates a movie and it succeeds. Alice, a user, makes the same call and the gateway answers 403 without calling the server. Alice editing another user's review passes the gateway, but the server's row filter matches nothing, so nothing changes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="758.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="35.0" y="18" width="150" height="40" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="110.0" y="40" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">client</text>
<rect x="305.0" y="18" width="150" height="40" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="380.0" y="40" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">keycloak</text>
<rect x="575.0" y="18" width="150" height="40" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="650.0" y="40" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">gateway</text>
<rect x="815.0" y="18" width="150" height="40" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="890.0" y="40" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">server</text>
<line x1="110" y1="58" x2="110" y2="712" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="380" y1="58" x2="380" y2="712" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="650" y1="58" x2="650" y2="712" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="890" y1="58" x2="890" y2="712" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="24" y1="70" x2="976" y2="70" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="32" y="90" font-size="12.5" font-weight="700" text-anchor="start" fill="#0a6190">Log in once (authorization code with PKCE)</text>
<path d="M 110 118 L 380 118" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="245.0" y="111" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">authorize + PKCE challenge</text>
<path d="M 380 150 L 110 150" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="245.0" y="143" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">login page; bob types his password; redirect with ?code</text>
<path d="M 110 182 L 380 182" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="245.0" y="175" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">exchange code + PKCE verifier</text>
<path d="M 380 214 L 110 214" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="245.0" y="207" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">access token (sub, name, roles: editor, user)</text>
<circle cx="124" cy="100" r="11" fill="#0a6190"/>
<text x="124" y="104.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<line x1="24" y1="236" x2="976" y2="236" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="32" y="256" font-size="12.5" font-weight="700" text-anchor="start" fill="#0a6190">Bob (editor) creates a movie</text>
<path d="M 110 290 L 650 290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="380.0" y="283" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">createMovies  +  Authorization: Bearer &lt;bob&gt;</text>
<path d="M 650 326 L 890 326" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="770.0" y="319" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">forward the same header  (catalog:write: yes)</text>
<path d="M 890 362 L 650 362" fill="none" stroke="#0b8a6a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="770.0" y="355" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200: created (token verified, role editor)</text>
<path d="M 650 398 L 110 398" fill="none" stroke="#0b8a6a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="380.0" y="391" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200: created</text>
<circle cx="636" cy="270" r="11" fill="#0a6190"/>
<text x="636" y="274.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<line x1="24" y1="414" x2="976" y2="414" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="32" y="434" font-size="12.5" font-weight="700" text-anchor="start" fill="#0a6190">Alice (user) makes the same call</text>
<path d="M 110 468 L 650 468" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="380.0" y="461" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">createMovies  +  Authorization: Bearer &lt;alice&gt;</text>
<path d="M 650 504 L 110 504" fill="none" stroke="#b42318" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="380.0" y="497" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">403: needs catalog:write</text>
<text x="890" y="504" font-size="12.5" font-weight="400" text-anchor="middle" fill="#0f2233" font-style="italic" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">server never called</text>
<circle cx="636" cy="452" r="11" fill="#0a6190"/>
<text x="636" y="456.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<line x1="24" y1="522" x2="976" y2="522" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="32" y="542" font-size="12.5" font-weight="700" text-anchor="start" fill="#0a6190">Alice edits a review she did not write</text>
<path d="M 110 576 L 650 576" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="380.0" y="569" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">updateReviews(where: id, ...)  +  Bearer &lt;alice&gt;</text>
<path d="M 650 612 L 890 612" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="770.0" y="605" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">forward  (reviews:write: yes)</text>
<path d="M 890 648 L 650 648" fill="none" stroke="#9a6700" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="770" y="641" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">filter: author.sub is not alice and she is no moderator</text>
<path d="M 650 684 L 110 684" fill="none" stroke="#9a6700" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="380.0" y="677" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200: reviews [ ]  - nothing changed, no error</text>
<circle cx="876" cy="596" r="11" fill="#0a6190"/>
<text x="876" y="600.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="32" y="735" font-size="12" font-weight="400" text-anchor="start" fill="#475569" font-style="italic">arrows:  green = allowed    red = refused at the gateway    amber = allowed, but the server's row filter matched nothing</text>
</svg>
