<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">With auth on, every write passes two independent checks and the server is only reachable through the gateway</title><desc id="d">The browser logs in at Keycloak and gets a token. It sends requests with the token to the gateway, which validates it and checks permissions per mutation, then forwards the Authorization header to the server. The server verifies the token again and applies row-level rules before touching Neo4j. The unchanged web app is an anonymous client.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="598.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="300" y="36" width="400" height="104" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="500.0" y="58" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">keycloak  :8081</text>
<text x="500" y="76" font-size="11.5" font-weight="400" text-anchor="middle" fill="#0f2233">token issuer (iss) = the address the browser sees:</text>
<text x="500" y="92" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0f2233">http://localhost:8081/realms/grandstack</text>
<text x="500" y="110" font-size="11.5" font-weight="400" text-anchor="middle" fill="#0f2233">keys (JWKS) fetched by container name inside the network:</text>
<text x="500" y="126" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0f2233">http://keycloak:8080/.../certs</text>
<rect x="30" y="250" width="160" height="100" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="110.0" y="272" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Browser</text>
<text x="110.0" y="292" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">demo client :3001</text>
<text x="110.0" y="308" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">or any OIDC client</text>
<rect x="280" y="220" width="240" height="160" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="400.0" y="242" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">gateway  :4000</text>
<text x="296" y="264" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">validate the token:</text>
<text x="296" y="279" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">signature (JWKS), expiry,</text>
<text x="296" y="294" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">issuer, audience</text>
<text x="296" y="309" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">check permissions per</text>
<text x="296" y="324" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">mutation (default deny)</text>
<text x="296" y="339" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">reads: no token needed</text>
<rect x="610" y="220" width="210" height="160" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="715.0" y="242" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">server  (no host port)</text>
<text x="626" y="268" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">verify the token again</text>
<text x="626" y="284" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">(same keys)</text>
<text x="626" y="300" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">@authentication: roles</text>
<text x="626" y="316" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">@authorization: row filters</text>
<rect x="880" y="255" width="90" height="90" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="925.0" y="277" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">neo4j</text>
<path d="M 110 250 L 110 84 L 300 84" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="122" y="76" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">login: OIDC code + PKCE</text>
<path d="M 300 124 L 150 124 L 150 250" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="162" y="144" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">access token</text>
<path d="M 190 300 L 280 300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="235" y="288" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /graphql</text>
<text x="235" y="322" font-size="11" font-weight="400" text-anchor="middle" fill="#475569" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Bearer token</text>
<path d="M 520 300 L 610 300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="565" y="288" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">forwards</text>
<text x="565" y="322" font-size="11" font-weight="400" text-anchor="middle" fill="#475569" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Authorization</text>
<path d="M 820 300 L 880 300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="850" y="288" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Bolt</text>
<path d="M 400 220 L 400 140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="414" y="180" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">JWKS</text>
<path d="M 715 220 L 715 84 L 700 84" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="727" y="160" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">JWKS</text>
<rect x="280" y="420" width="240" height="96" rx="8" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="400.0" y="442" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">refused at the gateway</text>
<text x="400.0" y="461" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">401: no or bad token on a write</text>
<text x="400.0" y="476" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">403: permission missing</text>
<text x="400.0" y="491" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">unknown mutations refused</text>
<rect x="610" y="420" width="240" height="96" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="730.0" y="442" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">decided at the server</text>
<text x="730.0" y="461" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">not your review: row not</text>
<text x="730.0" y="476" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">matched, nothing changes</text>
<text x="730.0" y="491" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">called directly: no token, 401</text>
<path d="M 400 380 L 400 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 715 380 L 715 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="30" y="420" width="200" height="96" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="130.0" y="442" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">grandstack-web</text>
<text x="130.0" y="461" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">unchanged, runs in the browser</text>
<text x="130.0" y="476" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">no token: reads work,</text>
<text x="130.0" y="491" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">writes are refused</text>
<line x1="130" y1="420" x2="130" y2="350" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<circle cx="300" cy="36" r="11" fill="#0a6190"/>
<text x="300" y="40.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="280" cy="224" r="11" fill="#0a6190"/>
<text x="280" y="228.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="610" cy="224" r="11" fill="#0a6190"/>
<text x="610" y="228.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="610" cy="384" r="11" fill="#0a6190"/>
<text x="610" y="388.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="30" cy="424" r="11" fill="#0a6190"/>
<text x="30" y="428.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="520" cy="424" r="11" fill="#0a6190"/>
<text x="520" y="428.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="500" y="560" font-size="12" font-weight="400" text-anchor="middle" fill="#475569" font-style="italic">dashed = the token coming back to the browser; dotted grey line = the app runs in the browser</text>
</svg>
